<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accounting Book Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <strong>Accounting Book</strong>
        <span id="user-label">Local dashboard</span>
      </div>
      <nav>
        <button class="nav-button active" data-view="dashboard">總覽</button>
        <button class="nav-button" data-view="ledgers">帳本</button>
        <button class="nav-button" data-view="transactions">交易</button>
        <button class="nav-button" data-view="budget">預算</button>
        <button class="nav-button" data-view="reports">報表</button>
        <button class="nav-button" data-view="settings">設定</button>
      </nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h1 id="page-title">總覽</h1>
          <p id="page-subtitle">本機 SQLite 資料檢視與管理</p>
        </div>
        <button id="refresh-button" class="secondary">重新整理</button>
      </header>

      <section id="status" class="status" hidden></section>

      <section id="dashboard-view" class="view active">
        <div class="metrics">
          <div class="metric"><span>本月進帳</span><strong id="metric-income">0</strong></div>
          <div class="metric"><span>本月支出</span><strong id="metric-expense">0</strong></div>
          <div class="metric"><span>本月結餘</span><strong id="metric-balance">0</strong></div>
          <div class="metric"><span>交易筆數</span><strong id="metric-count">0</strong></div>
        </div>
        <section class="panel">
          <h2>帳本概況</h2>
          <div id="dashboard-ledgers" class="list"></div>
        </section>
        <div class="chart-grid">
          <section class="panel">
            <h2>進帳 - 支出淨額</h2>
            <div id="income-expense-chart" class="chart-box"></div>
          </section>
          <section class="panel">
            <h2>支出類別分布</h2>
            <div id="expense-category-chart" class="chart-box"></div>
          </section>
        </div>
        <section class="panel">
          <h2>各帳本本月支出</h2>
          <div id="ledger-expense-chart" class="bar-list"></div>
        </section>
      </section>

      <section id="ledgers-view" class="view">
        <section class="panel">
          <div class="section-header">
            <h2>未封存帳本</h2>
            <form id="ledger-create-form" class="inline-form">
              <input name="name" placeholder="新帳本名稱" maxlength="30" />
              <button type="submit">新增</button>
            </form>
          </div>
          <div id="active-ledgers" class="list"></div>
        </section>
        <section class="panel">
          <h2>封存帳本</h2>
          <div id="archived-ledgers" class="list"></div>
        </section>
      </section>

      <section id="transactions-view" class="view">
        <section class="panel">
          <div class="section-header">
            <h2>交易查詢</h2>
            <button id="export-csv-btn" class="secondary">匯出 CSV</button>
          </div>
          <form id="transaction-filter" class="toolbar">
            <select name="ledgerId"></select>
            <input type="date" name="start" />
            <input type="date" name="end" />
            <button type="submit">查詢</button>
          </form>
          <div id="transaction-summary" class="summary"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>時間</th>
                  <th>類型</th>
                  <th>金額</th>
                  <th>類別</th>
                  <th>付款方式</th>
                  <th>備註</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="transactions-table"></tbody>
            </table>
          </div>
        </section>
      </section>

      <!-- ── 預算管理 ──────────────────────────────────────────────────── -->
      <section id="budget-view" class="view">
        <section class="panel">
          <div class="section-header">
            <h2>月份預算</h2>
            <div class="month-nav">
              <button id="budget-prev-month" class="secondary">‹</button>
              <span id="budget-month-label"></span>
              <button id="budget-next-month" class="secondary">›</button>
            </div>
          </div>
          <div id="budget-list" class="list"></div>
          <form id="budget-add-form" class="inline-form" style="margin-top:14px">
            <select id="budget-category-select" name="category"></select>
            <input type="number" name="amount" placeholder="預算金額" min="1" step="1" style="width:130px" />
            <button type="submit">設定預算</button>
          </form>
        </section>
      </section>

      <!-- ── 趨勢報表 ──────────────────────────────────────────────────── -->
      <section id="reports-view" class="view">
        <div class="metrics" id="reports-metrics">
          <div class="metric"><span>平均月支出</span><strong id="rpt-avg-expense">0</strong></div>
          <div class="metric"><span>最高月支出</span><strong id="rpt-max-expense">0</strong></div>
          <div class="metric"><span>平均月進帳</span><strong id="rpt-avg-income">0</strong></div>
          <div class="metric"><span>最高月進帳</span><strong id="rpt-max-income">0</strong></div>
        </div>
        <section class="panel">
          <div class="section-header">
            <h2>收支趨勢</h2>
            <select id="trend-months">
              <option value="6">過去 6 個月</option>
              <option value="12">過去 12 個月</option>
              <option value="24">過去 24 個月</option>
            </select>
          </div>
          <div id="trend-chart"></div>
          <div class="trend-legend">
            <span><span class="swatch" style="background:var(--success)"></span>進帳</span>
            <span><span class="swatch" style="background:var(--danger)"></span>支出</span>
          </div>
        </section>
      </section>

      <section id="settings-view" class="view">
        <section class="panel">
          <h2>付款方式</h2>
          <form class="inline-form setting-create" data-kind="payment">
            <input name="name" placeholder="新增付款方式" maxlength="40" />
            <button type="submit">新增</button>
          </form>
          <div id="payment-settings" class="list"></div>
        </section>
        <section class="panel">
          <h2>支出類別</h2>
          <form class="inline-form setting-create" data-kind="expense-category">
            <input name="name" placeholder="新增支出類別" maxlength="40" />
            <button type="submit">新增</button>
          </form>
          <div id="expense-settings" class="category-list"></div>
        </section>
        <section class="panel">
          <h2>收入類別</h2>
          <form class="inline-form setting-create" data-kind="income-category">
            <input name="name" placeholder="新增收入類別" maxlength="40" />
            <button type="submit">新增</button>
          </form>
          <div id="income-settings" class="category-list"></div>
        </section>
      </section>
    </main>

    <!-- ── 新增交易 Modal ────────────────────────────────────────────────── -->
    <div id="tx-modal-overlay" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">新增交易</h2>
        <form id="tx-modal-form" autocomplete="off">
          <div class="form-row">
            <label>類型</label>
            <div class="type-toggle">
              <button type="button" class="type-btn active" data-type="expense">支出</button>
              <button type="button" class="type-btn" data-type="income">進帳</button>
            </div>
          </div>
          <div class="form-row">
            <label>帳本</label>
            <select id="modal-ledger" name="ledgerId"></select>
          </div>
          <div class="form-row">
            <label>類別</label>
            <select id="modal-category" name="category"></select>
          </div>
          <div class="form-row">
            <label>子類別</label>
            <select id="modal-subcategory" name="subcategory"></select>
          </div>
          <div class="form-row">
            <label>付款方式</label>
            <select id="modal-payment" name="paymentMethod"></select>
          </div>
          <div class="form-row">
            <label>金額</label>
            <input id="modal-amount" type="number" name="amount" placeholder="0" min="0.01" step="0.01" />
          </div>
          <div class="form-row">
            <label>備註</label>
            <input type="text" name="description" placeholder="（可留空）" maxlength="200" />
          </div>
          <div class="modal-actions">
            <button type="button" id="tx-modal-cancel" class="secondary">取消</button>
            <button type="submit">確定新增</button>
          </div>
        </form>
      </div>
    </div>

    <button id="add-tx-fab" class="fab" title="新增交易">＋</button>

    <script src="/app.js"></script>
  </body>
</html>
